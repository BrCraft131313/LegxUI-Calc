<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LegxUI Calc</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .calculator {
            background: #222;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 320px;
        }

        .display {
            background: #333;
            color: #fff;
            font-size: 2rem;
            padding: 20px;
            text-align: left;
            border-radius: 10px;
            margin-bottom: 20px;
            min-height: 80px;
            word-break: break-all;
            word-wrap: break-word;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            background: #444;
            color: #fff;
            border: none;
            padding: 15px;
            font-size: 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #555;
        }

        button.operator {
            background: #ff9500;
        }

        button.operator:hover {
            background: #e08500;
        }

        button.clear {
            background: #ff3b30;
        }

        button.clear:hover {
            background: #d32f2f;
        }

        button.equal {
            background: #34c759;
            grid-column: span 2;
        }

        button.equal:hover {
            background: #28a745;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <div id="display" class="display">0</div>
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button onclick="appendValue('/')" class="operator">÷</button>
            <button onclick="appendValue('*')" class="operator">×</button>
            <button onclick="appendValue('-')" class="operator">-</button>
            
            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button onclick="appendValue('+')" class="operator">+</button>
            
            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button onclick="appendValue('.')">.</button>
            
            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="appendValue('0')">0</button>
            
            <button class="equal" onclick="calculateResult()">=</button>
        </div>
    </div>
<a href="https://brcraft131313.github.io/LegxUI" text-decoration: none; >LegxUI</a>
    <script>
        const display = document.getElementById('display');

        function appendValue(val) {
            if (display.innerText === '0' && val !== '.') {
                display.innerText = val;
            } else {
                display.innerText += val;
            }
        }

        function clearDisplay() {
            display.innerText = '0';
        }

        function calculateResult() {
            try {
                // استبدال الرموز المرئية برموز البرمجة الصحيحة
                let expression = display.innerText.replace(/×/g, '*').replace(/÷/g, '/');
                display.innerText = eval(expression);
            } catch (error) {
                display.innerText = 'Error!';
                setTimeout(clearDisplay, 1500);
            }
        }
    </script>
</body>
              </html>
